<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer | BP Murcia 2026</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['"Archivo Black"', 'sans-serif'],
                        'body': ['"Space Grotesk"', 'sans-serif'],
                    },
                    colors: {
                        'murcia-red': '#D9291C',      
                        'murcia-dark': '#0f0f0f',
                        'murcia-pastel': '#FCE7E7', 
                        'paper': '#f8f8f8',
                    },
                    animation: {
                        'flash-alarm': 'flash 0.5s infinite',
                    },
                    keyframes: {
                        flash: {
                            '0%, 100%': { backgroundColor: '#D9291C', color: '#ffffff' },
                            '50%': { backgroundColor: '#0f0f0f', color: '#D9291C' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            overflow-x: hidden; 
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }
        
        * { border-radius: 0 !important; }

        .text-stroke { -webkit-text-stroke: 2px currentColor; color: transparent; }
        
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- BOTONES BRUTALISTAS --- */
        .btn-brutal {
            border: 4px solid currentColor;
            box-shadow: 6px 6px 0px 0px currentColor;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-brutal:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px 0px currentColor;
        }
        .btn-numpad {
            font-family: 'Archivo Black', sans-serif;
            font-size: 2rem;
        }

        /* --- TOGGLE SWITCH MEJORADO --- */
        .toggle-checkbox {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }
        
        .toggle-track {
            position: relative;
            display: inline-block;
            width: 64px;
            height: 36px;
            background-color: #e0e0e0;
            border: 3px solid #0f0f0f;
            transition: all 0.3s ease;
        }

        .toggle-thumb {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 4px;
            height: 22px; 
            width: 22px;
            background-color: #0f0f0f;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            border: 2px solid transparent;
        }
        
        /* Estado Activo (Checked) */
        .toggle-checkbox:checked + .toggle-track {
            background-color: #D9291C;
            border-color: #0f0f0f;
        }
        
        .toggle-checkbox:checked + .toggle-track .toggle-thumb {
            left: calc(100% - 26px);
            background-color: #ffffff;
            border-color: #0f0f0f;
        }

        /* Dark Mode Ajustes */
        .dark .toggle-track { 
            background-color: #333; 
            border-color: #f8f8f8; 
        }
        .dark .toggle-thumb { 
            background-color: #f8f8f8; 
        }
        .dark .toggle-checkbox:checked + .toggle-track {
            background-color: #D9291C;
            border-color: #f8f8f8;
        }
        .dark .toggle-checkbox:checked + .toggle-track .toggle-thumb {
            background-color: #0f0f0f;
            border-color: #f8f8f8;
        }

        .digit-box { font-variant-numeric: tabular-nums; }
        .alarm-state { animation: flash-alarm 0.5s infinite; }
        .alarm-state * { animation: none !important; }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D9291C; border-left: 2px solid #0f0f0f; }
    </style>
</head>
<body id="mainBody" class="font-body min-h-screen flex flex-col relative bg-paper text-murcia-dark dark:bg-murcia-dark dark:text-paper transition-colors duration-300">

    <div class="noise-overlay z-0"></div>

    <header class="flex justify-between items-center p-6 border-b-4 border-murcia-dark dark:border-paper bg-white dark:bg-murcia-dark z-20 relative shrink-0 transition-colors duration-300">
        <div class="flex items-center gap-4">
            <div class="font-display text-2xl tracking-tighter">BP MURCIA <span class="text-murcia-red">2026</span></div>
        </div>
        
        <div class="flex items-center gap-6">
            <button id="fullscreenBtn" onclick="toggleFullScreen()" class="text-3xl hover:text-murcia-red transition-colors active:scale-95" title="Pantalla Completa">
                <i id="fsIcon" class="ph-bold ph-arrows-out"></i>
            </button>
            
            <button id="menuToggleBtn" class="text-4xl hover:text-murcia-red transition-colors active:scale-95">
                <i class="ph-bold ph-list"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 z-10 relative w-full max-w-7xl mx-auto">
        
        <div class="w-full text-center mb-12 relative mt-4 group">
            <div class="inline-block relative">
                 <div class="absolute inset-0 bg-murcia-red translate-x-4 translate-y-4 -z-10 border-4 border-murcia-dark dark:border-paper hidden md:block transition-transform group-hover:translate-x-6 group-hover:translate-y-6"></div>
                
                <div class="bg-white dark:bg-black border-4 border-murcia-dark dark:border-paper p-8 md:p-16 transition-colors duration-300 relative overflow-hidden">
                     
                     <div id="courtesyIndicator" class="hidden absolute top-0 left-0 w-full bg-murcia-red text-white font-mono text-sm md:text-xl uppercase font-bold tracking-[0.3em] py-3 border-b-4 border-murcia-dark">
                        CORTESÍA: <span id="courtesyCount">15</span>s
                     </div>

                     <div id="modeLabel" class="hidden absolute top-2 right-4 font-mono text-xs text-murcia-red tracking-widest uppercase font-bold">CRONÓMETRO</div>

                     <h1 id="display" class="font-display text-[15vw] md:text-[11rem] leading-none tracking-tight digit-box select-none">
                        <span id="hVal">00</span><span class="text-murcia-red pb-4 inline-block align-top text-[0.8em]">:</span><span id="mVal">00</span><span class="text-murcia-red pb-4 inline-block align-top text-[0.8em]">:</span><span id="sVal">00</span>
                    </h1>
                </div>
            </div>
        </div>

        <div id="setupPanel" class="w-full max-w-md mb-12">
            <div class="grid grid-cols-3 gap-4">
                <button onclick="addNumber(1)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">1</button>
                <button onclick="addNumber(2)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">2</button>
                <button onclick="addNumber(3)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">3</button>
                
                <button onclick="addNumber(4)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">4</button>
                <button onclick="addNumber(5)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">5</button>
                <button onclick="addNumber(6)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">6</button>
                
                <button onclick="addNumber(7)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">7</button>
                <button onclick="addNumber(8)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">8</button>
                <button onclick="addNumber(9)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">9</button>
                
                <button onclick="clearInput()" class="btn-numpad btn-brutal py-4 bg-gray-200 dark:bg-gray-700 text-base font-bold tracking-widest uppercase text-murcia-red hover:bg-gray-300">Borrar</button>
                <button onclick="addNumber(0)" class="btn-numpad btn-brutal py-4 bg-white dark:bg-gray-800 hover:bg-murcia-pastel dark:hover:bg-gray-700">0</button>
                <button onclick="setTimer()" class="btn-numpad btn-brutal py-4 bg-murcia-dark dark:bg-paper text-white dark:text-murcia-dark text-base font-bold tracking-widest uppercase hover:bg-murcia-red dark:hover:bg-murcia-red dark:hover:text-white transition-colors">SET</button>
            </div>
        </div>

        <div id="timerControls" class="w-full max-w-2xl hidden grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
            
            <button id="startStopBtn" onclick="toggleStartStop()" class="btn-brutal bg-green-600 text-white dark:border-paper font-display uppercase text-3xl py-6 flex items-center justify-center gap-3 hover:bg-green-500 active:translate-y-1 active:shadow-none">
                <i class="ph-fill ph-play" id="playIcon"></i>
                <span id="btnText">Start</span>
            </button>

            <button onclick="resetTimer()" class="btn-brutal bg-white dark:bg-gray-800 text-current dark:border-paper font-display uppercase text-3xl py-6 flex items-center justify-center gap-3 hover:text-murcia-red active:translate-y-1 active:shadow-none">
                <i class="ph-bold ph-arrow-counter-clockwise"></i>
                <span>Reset</span>
            </button>

        </div>

         <div class="mt-8 opacity-70 hover:opacity-100 transition-opacity">
            <a href="#" class="font-display uppercase tracking-widest text-sm hover:text-murcia-red border-b-2 border-transparent hover:border-murcia-red transition-colors inline-flex items-center gap-2">
                <i class="ph-bold ph-arrow-left"></i> Volver al Inicio
            </a>
        </div>

    </main>

    <div id="optionsModal" class="fixed inset-0 bg-black/80 z-50 hidden flex justify-end transition-opacity duration-300 backdrop-blur-sm">
        
        <div class="bg-paper dark:bg-murcia-dark text-murcia-dark dark:text-paper w-full md:w-[500px] h-full border-l-8 border-murcia-dark dark:border-paper p-10 flex flex-col shadow-[-20px_0_0_0_rgba(217,41,28,1)] overflow-y-auto">
            
            <div class="flex justify-between items-center mb-12 border-b-4 border-current pb-6">
                <h2 class="font-display text-4xl uppercase tracking-wider">Ajustes</h2>
                <button id="menuCloseBtn" class="text-4xl hover:text-murcia-red transition-transform hover:rotate-90">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>

            <div class="mb-12">
                <div class="flex items-center gap-3 mb-6 opacity-50">
                    <i class="ph-fill ph-gear-six text-2xl"></i>
                    <h3 class="font-display text-lg uppercase tracking-widest">Modo</h3>
                </div>

                <div class="flex justify-between items-center p-4 border-4 border-current bg-white/5 hover:bg-black/5 dark:hover:bg-white/5 transition-colors mb-6">
                    <div class="flex flex-col">
                        <span class="font-display text-xl uppercase">Modo Cronómetro</span>
                        <span class="font-mono text-xs opacity-60">Cuenta progresiva</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="stopwatchToggle" class="toggle-checkbox">
                        <div class="toggle-track">
                            <div class="toggle-thumb"></div>
                        </div>
                    </label>
                </div>
            </div>

            <div class="mb-12">
                <div class="flex items-center gap-3 mb-6 opacity-50">
                    <i class="ph-fill ph-paint-brush-broad text-2xl"></i>
                    <h3 class="font-display text-lg uppercase tracking-widest">Visual</h3>
                </div>
                
                <div class="flex justify-between items-center p-4 border-4 border-current bg-white/5 hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                    <div class="flex flex-col">
                        <span class="font-display text-xl uppercase">Modo Oscuro</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="darkModeToggle" class="toggle-checkbox">
                        <div class="toggle-track">
                            <div class="toggle-thumb"></div>
                        </div>
                    </label>
                </div>
            </div>

            <div class="mb-12">
                <div class="flex items-center gap-3 mb-6 opacity-50">
                    <i class="ph-fill ph-speaker-high text-2xl"></i>
                    <h3 class="font-display text-lg uppercase tracking-widest">Audio & Alarma</h3>
                </div>

                <div class="flex justify-between items-center mb-6 p-4 border-4 border-current bg-white/5 hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                    <div class="flex flex-col">
                        <span class="font-display text-xl uppercase">Silenciar</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="muteToggle" class="toggle-checkbox">
                        <div class="toggle-track">
                            <div class="toggle-thumb"></div>
                        </div>
                    </label>
                </div>

                <div class="flex justify-between items-center mb-6 p-4 border-4 border-current bg-white/5 hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                    <div class="flex flex-col">
                        <span class="font-display text-xl uppercase">Tiempo de Cortesía</span>
                        <span class="font-mono text-xs text-murcia-red font-bold mt-1 bg-murcia-pastel/50 inline-block px-2 py-0.5 border border-murcia-red/20">15s de espera</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="courtesyToggle" class="toggle-checkbox">
                        <div class="toggle-track">
                            <div class="toggle-thumb"></div>
                        </div>
                    </label>
                </div>
                
                <div class="text-center font-mono text-xs uppercase opacity-60 mt-4">
                    <button onclick="testAudio()" class="mt-2 font-display text-sm tracking-widest text-murcia-red border-b-2 border-murcia-red hover:bg-murcia-red hover:text-white transition-colors">
                        <i class="ph-bold ph-play-circle mr-1"></i> PROBAR SONIDO
                    </button>
                </div>
                
                <audio id="alarmAudio" src="audio/alarma.mp3" preload="auto"></audio>
            </div>

            <div class="mt-auto pt-8 border-t-4 border-current opacity-40 text-center font-mono text-xs uppercase tracking-widest">
                BP Murcia 2026
            </div>

        </div>
    </div>


    <script>
        // --- GESTIÓN DE UI & OPCIONES ---
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const menuCloseBtn = document.getElementById('menuCloseBtn');
        const optionsModal = document.getElementById('optionsModal');
        const htmlElement = document.documentElement;
        
        // Fullscreen
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fsIcon = document.getElementById('fsIcon');

        // Toggles
        const darkModeToggle = document.getElementById('darkModeToggle');
        const muteToggle = document.getElementById('muteToggle');
        const courtesyToggle = document.getElementById('courtesyToggle');
        const stopwatchToggle = document.getElementById('stopwatchToggle'); // Nuevo
        
        // Elementos visuales
        const courtesyIndicator = document.getElementById('courtesyIndicator');
        const courtesyCountDisplay = document.getElementById('courtesyCount');
        const modeLabel = document.getElementById('modeLabel');

        // Audio
        const alarmAudio = document.getElementById('alarmAudio');
        
        // Variables Estado
        let isMuted = false;
        let isCourtesyMode = false;
        let isStopwatchMode = false; // Nuevo: Controla si es cronómetro
        let courtesyTimeout1, courtesyTimeout2, courtesyInterval;
        let timerInterval;
        let isRunning = false;
        let inputBuffer = "";
        let totalSeconds = 0;
        let initialSeconds = 0;

        // Elementos Cronómetro
        const hVal = document.getElementById('hVal');
        const mVal = document.getElementById('mVal');
        const sVal = document.getElementById('sVal');
        const setupPanel = document.getElementById('setupPanel');
        const timerControls = document.getElementById('timerControls');
        const startStopBtn = document.getElementById('startStopBtn');
        const btnText = document.getElementById('btnText');
        const playIcon = document.getElementById('playIcon');
        const mainBody = document.getElementById('mainBody');

        // --- LISTENERS ---

        menuToggleBtn.addEventListener('click', () => optionsModal.classList.remove('hidden'));
        menuCloseBtn.addEventListener('click', () => optionsModal.classList.add('hidden'));

        darkModeToggle.addEventListener('change', (e) => {
            if(e.target.checked) htmlElement.classList.add('dark');
            else htmlElement.classList.remove('dark');
        });

        muteToggle.addEventListener('change', (e) => isMuted = e.target.checked);
        courtesyToggle.addEventListener('change', (e) => isCourtesyMode = e.target.checked);
        
        // Lógica Cambio de Modo
        stopwatchToggle.addEventListener('change', (e) => {
            isStopwatchMode = e.target.checked;
            resetTimer(); // Resetear todo al cambiar
            
            if (isStopwatchMode) {
                // Modo Cronómetro: Ocultar teclado, mostrar 00:00:00 y etiqueta
                setupPanel.classList.add('hidden');
                timerControls.classList.remove('hidden');
                modeLabel.classList.remove('hidden');
                totalSeconds = 0;
                updateDisplay(0);
            } else {
                // Modo Timer: Mostrar teclado, ocultar controles hasta SET
                setupPanel.classList.remove('hidden');
                timerControls.classList.add('hidden');
                modeLabel.classList.add('hidden');
                inputBuffer = "";
                updateDisplayFromBuffer();
            }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fsIcon.classList.replace('ph-arrows-out', 'ph-arrows-in');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fsIcon.classList.replace('ph-arrows-in', 'ph-arrows-out');
                }
            }
        }

        function testAudio() {
            if (!isMuted) {
                alarmAudio.currentTime = 0;
                alarmAudio.loop = false;
                alarmAudio.play().catch(e => alert("No se pudo reproducir audio."));
            } else {
                alert("El modo silencio está activado.");
            }
        }

        // --- LÓGICA CORE ---

        function updateDisplayFromBuffer() {
            let padded = inputBuffer.padStart(6, '0');
            hVal.innerText = padded.slice(0, 2);
            mVal.innerText = padded.slice(2, 4);
            sVal.innerText = padded.slice(4, 6);
        }

        function addNumber(num) {
            if (inputBuffer.length < 6) {
                if (inputBuffer.length === 0 && num === 0) return; 
                inputBuffer += num;
                updateDisplayFromBuffer();
            }
        }

        function clearInput() {
            inputBuffer = "";
            updateDisplayFromBuffer();
        }

        function setTimer() {
            // Convierte el buffer a segundos
            if (inputBuffer.length === 0) return;
            let padded = inputBuffer.padStart(6, '0');
            let h = parseInt(padded.slice(0, 2));
            let m = parseInt(padded.slice(2, 4));
            let s = parseInt(padded.slice(4, 6));

            totalSeconds = (h * 3600) + (m * 60) + s;
            initialSeconds = totalSeconds;

            if (totalSeconds > 0) {
                setupPanel.classList.add('hidden');
                timerControls.classList.remove('hidden');
            }
        }

        function toggleStartStop() {
            if (isRunning) {
                // Pausar
                clearInterval(timerInterval);
                isRunning = false;
                btnText.innerText = "Resume";
                playIcon.classList.replace('ph-pause', 'ph-play');
                startStopBtn.classList.replace('bg-murcia-dark', 'bg-green-600');
                startStopBtn.classList.replace('dark:bg-paper', 'bg-green-600'); 
                startStopBtn.classList.remove('text-white', 'text-murcia-dark'); // Limpiar clases específicas de tema
                startStopBtn.classList.add('text-white'); // Volver a estilo botón verde
                
                // Pausar cortesía si está activa
                if(courtesyInterval) clearInterval(courtesyInterval);
                clearTimeout(courtesyTimeout1);
                clearTimeout(courtesyTimeout2);
                
                // Parar alarma
                alarmAudio.pause();
                alarmAudio.currentTime = 0;
                mainBody.classList.remove('alarm-state');
                
            } else {
                // Arrancar
                isRunning = true;
                btnText.innerText = "Pause";
                playIcon.classList.replace('ph-play', 'ph-pause');
                
                // Cambiar estilo botón a "neutro/oscuro" mientras corre
                startStopBtn.classList.remove('bg-green-600', 'text-white');
                startStopBtn.classList.add('bg-murcia-dark', 'text-white', 'dark:bg-paper', 'dark:text-murcia-dark');

                timerInterval = setInterval(() => {
                    if (isStopwatchMode) {
                        // MODO CRONÓMETRO: Cuenta hacia ARRIBA
                        totalSeconds++;
                        updateDisplay(totalSeconds);
                    } else {
                        // MODO TIMER: Cuenta hacia ABAJO
                        if (totalSeconds > 0) {
                            totalSeconds--;
                            updateDisplay(totalSeconds);
                        } else {
                            // Timer llegó a 0
                            clearInterval(timerInterval);
                            triggerAlarmLogic();
                        }
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            
            // Limpiar alarmas y cortesía
            clearTimeout(courtesyTimeout1);
            clearTimeout(courtesyTimeout2);
            clearInterval(courtesyInterval);
            mainBody.classList.remove('alarm-state');
            courtesyIndicator.classList.add('hidden');
            alarmAudio.pause();
            alarmAudio.currentTime = 0;

            // Resetear UI Botón
            btnText.innerText = "Start";
            playIcon.classList.replace('ph-pause', 'ph-play');
            startStopBtn.classList.remove('bg-murcia-dark', 'dark:bg-paper', 'dark:text-murcia-dark');
            startStopBtn.classList.add('bg-green-600', 'text-white');

            if (isStopwatchMode) {
                // Reset a 00:00:00 pero mantener controles
                totalSeconds = 0;
                updateDisplay(0);
            } else {
                // Reset a Input y volver a mostrar teclado
                timerControls.classList.add('hidden');
                setupPanel.classList.remove('hidden');
                inputBuffer = "";
                updateDisplayFromBuffer();
            }
        }

        function updateDisplay(secondsTotal) {
            const h = Math.floor(secondsTotal / 3600);
            const m = Math.floor((secondsTotal % 3600) / 60);
            const s = secondsTotal % 60;

            hVal.innerText = String(h).padStart(2, '0');
            mVal.innerText = String(m).padStart(2, '0');
            sVal.innerText = String(s).padStart(2, '0');
        }

        // --- LÓGICA DE ALARMA (Solo Timer) ---
        function triggerAlarmLogic() {
            // Sonido inicial
            if (!isMuted) {
                alarmAudio.loop = true;
                alarmAudio.play().catch(e => console.log(e));
            }
            mainBody.classList.add('alarm-state');

            // Si cortesía está activada
            if (isCourtesyMode) {
                let cTime = 15;
                courtesyIndicator.classList.remove('hidden');
                courtesyCountDisplay.innerText = cTime;

                courtesyInterval = setInterval(() => {
                    cTime--;
                    courtesyCountDisplay.innerText = cTime;
                    if (cTime <= 0) clearInterval(courtesyInterval);
                }, 1000);

                // Parar parpadeo y sonido a los 15s
                courtesyTimeout1 = setTimeout(() => {
                    mainBody.classList.remove('alarm-state');
                    alarmAudio.pause();
                    alarmAudio.currentTime = 0;
                }, 15000);
            }
        }
    </script>
</body>
